# Fly.io configuration. One machine, one volume: SQLite needs a single writer.

app = "wcs-workshops"
primary_region = "ord"

[build]
  # Firebase web config (public). Fill in from Firebase console > Project settings > Your apps.
  [build.args]
    VITE_FIREBASE_API_KEY = "AIzaSyCzBZgEc7CMcPjtD_9pfQTk_wbOOafMxnI"
    VITE_FIREBASE_AUTH_DOMAIN = "wcs-workshops.firebaseapp.com"
    VITE_FIREBASE_PROJECT_ID = "wcs-workshops"
    VITE_FIREBASE_APP_ID = "1:821837247306:web:7b1428ff23ea8b204107b3"
    VITE_FIREBASE_MESSAGING_SENDER_ID = "821837247306"

[env]
  DATABASE_PATH = "/data/wcs.db"
  # Origin in QR codes and share links. Change it when you add a custom domain.
  PUBLIC_URL = "https://wcs-workshops.fly.dev"
  FIREBASE_PROJECT_ID = "wcs-workshops"
  VIMEO_PRIVACY = "unlisted"
  # Only the Capacitor shells are cross-origin; the web app is served by this binary.
  CORS_ORIGINS = "capacitor://localhost,http://localhost"

# Secrets, set with `fly secrets set`: VIMEO_ACCESS_TOKEN, FIREBASE_CREDENTIALS_JSON

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep exactly one machine running: SQLite on a volume cannot be shared.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
