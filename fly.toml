# fly.toml app configuration file generated for wcs-workshops on 2026-11-10T00:37:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wcs-workshops'
primary_region = 'ord'

[build]
[env]
  CORS_ORIGINS = 'capacitor://localhost,http://localhost'
  DATABASE_PATH = '/data/wcs.db'
  FIREBASE_PROJECT_ID = ''
  VIMEO_PRIVACY = 'unlisted'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
